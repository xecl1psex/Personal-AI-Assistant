name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Create Android platform files
        run: flutter create --platforms=android --project-name personal_ai --org com.xecl1psex .

      - name: Patch Kotlin version
        run: |
          sed -i 's|id "org.jetbrains.kotlin.android" version "[^"]*"|id "org.jetbrains.kotlin.android" version "1.9.24"|' android/settings.gradle

      - name: Add INTERNET permission
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i 's|<manifest xmlns:android="http://schemas.android.com/apk/res/android">|<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.INTERNET"/>|' "$MANIFEST"
          fi

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/personal_ai.jks
          ls -la android/app/personal_ai.jks

      - name: Create key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=personal_ai.jks
          EOF

      - name: Patch build.gradle for signing
        run: |
          python3 <<'PYEOF'
          path = 'android/app/build.gradle'
          with open(path, 'r') as f:
              content = f.read()

          # 1. Add keystoreProperties before android {
          if 'keystoreProperties' not in content:
              props_block = """def keystoreProperties = new Properties()
          def keystorePropertiesFile = rootProject.file('key.properties')
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }

          """
              content = content.replace('android {', props_block + 'android {', 1)

          # 2. Add signingConfigs.release inside android {
          if "signingConfigs {" not in content:
              signing_block = """    signingConfigs {
                  release {
                      keyAlias keystoreProperties['keyAlias']
                      keyPassword keystoreProperties['keyPassword']
                      storeFile file(keystoreProperties['storeFile'])
                      storePassword keystoreProperties['storePassword']
                  }
              }

          """
              content = content.replace('android {', 'android {\n' + signing_block, 1)

          # 3. Replace debug signing with release (BOTH variants: with and without =)
          content = content.replace('signingConfig = signingConfigs.debug', 'signingConfig = signingConfigs.release')
          content = content.replace('signingConfig signingConfigs.debug', 'signingConfig signingConfigs.release')

          with open(path, 'w') as f:
              f.write(content)

          print("=== build.gradle ===")
          print(content)
          PYEOF
          
      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
