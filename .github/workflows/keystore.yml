name: Generate Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Generate keystore
        run: |
          keytool -genkey -v -keystore personal_ai.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias personal_ai \
            -storepass personal_ai_pass \
            -keypass personal_ai_pass \
            -dname "CN=Personal AI, OU=Dev, O=Personal, L=Moscow, S=Moscow, C=RU"
          echo "=== Keystore info ==="
          keytool -list -v -keystore personal_ai.jks -storepass personal_ai_pass

      - name: Encode to base64
        run: |
          base64 personal_ai.jks > personal_ai.jks.base64
          echo "=== base64 size ==="
          wc -c personal_ai.jks.base64

      - name: Upload keystore files
        uses: actions/upload-artifact@v4
        with:
          name: keystore
          path: |
            personal_ai.jks
            personal_ai.jks.base64
