name: Generate Keystore (One Time)

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore personal_ai.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias personal_ai \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -keypass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -dname "CN=Personal AI, OU=Dev, O=Personal, L=Moscow, S=Moscow, C=RU"

      - name: Encode to base64
        run: |
          base64 personal_ai.jks | tr -d '\n' > personal_ai.jks.base64
          echo "Base64 size: $(wc -c < personal_ai.jks.base64) bytes"

      - name: Upload as artifact
        uses: actions/upload-artifact@v4
        with:
          name: new-keystore
          path: |
            personal_ai.jks
            personal_ai.jks.base64
          retention-days: 1
